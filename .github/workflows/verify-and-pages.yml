name: Verify and publish Ski-Shooter
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ski-shooter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Physics, collision, replay and complete mission tests
        run: node --test tests/*.test.mjs
      - name: Verify source pins and model conversions
        run: python3 scripts/verify.py
      - name: Build allowlisted static package
        run: python3 scripts/build.py
      - name: Chromium rendering and UI smoke check
        run: python3 scripts/browser_smoke.py
      - name: Retain verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ski-shooter-verification
          path: |
            artifacts/
            dist/manifest.json
          retention-days: 14
      - name: Retain playable static package
        uses: actions/upload-artifact@v4
        with:
          name: ski-shooter-static
          path: dist/
      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
